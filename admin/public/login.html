<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07172b">
    <title>Login | WEB-CLUB</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css?v=3">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../../frontend/index.html" class="auth-brand" aria-label="WEB-CLUB home">
                <span class="auth-brand-mark"><i class="bx bx-code-alt" aria-hidden="true"></i></span>
                <span class="auth-brand-copy"><strong>WEB-CLUB</strong><small>Learn · Build · Grow Together</small></span>
            </a>
            <div class="auth-nav-prompt">
                <span>Don’t have an account?</span>
                <a href="./register.html">Join Club</a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="loginTitle">
            <div class="auth-header">
                <div class="auth-icon"><i class="bx bxs-graduation" aria-hidden="true"></i></div>
                <h1 id="loginTitle">Welcome back</h1>
                <p>Log in to continue your WEB-CLUB journey.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon"><i class="bx bx-envelope" aria-hidden="true"></i></span>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon"><i class="bx bx-lock-alt" aria-hidden="true"></i></span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">
                            <i class="bx bx-show" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="remember-option"><input id="rememberEmail" type="checkbox"><span>Remember email</span></label>
                </div>

                <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary auth-button">
                    <span>Log in</span><i class="bx bx-right-arrow-alt" aria-hidden="true"></i>
                </button>
            </form>

            <p class="auth-footer">New to WEB-CLUB? <a href="./register.html">Create your account</a></p>
        </section>

        <p class="auth-tagline">Build your skills. Share your ideas. Grow together.</p>
    </main>
    <script src="../js/auth.js?v=2"></script>
</body>
</html>
