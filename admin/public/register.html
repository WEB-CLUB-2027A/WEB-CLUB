<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07172b">
    <title>Join | WEB-CLUB</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css?v=3">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../../frontend/index.html" class="auth-brand" aria-label="WEB-CLUB home">
                <span class="auth-brand-mark"><i class="bx bx-code-alt" aria-hidden="true"></i></span>
                <span class="auth-brand-copy"><strong>WEB-CLUB</strong><small>Learn · Build · Grow Together</small></span>
            </a>
            <div class="auth-nav-prompt">
                <span>Already a member?</span>
                <a href="./login.html">Log in</a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card register-card" aria-labelledby="registerTitle">
            <div class="auth-header">
                <div class="auth-icon"><i class="bx bxs-graduation" aria-hidden="true"></i></div>
                <h1 id="registerTitle">Create your account</h1>
                <p>Join the community and start building together.</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon"><i class="bx bx-user" aria-hidden="true"></i></span>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" maxlength="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon"><i class="bx bx-envelope" aria-hidden="true"></i></span>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon"><i class="bx bx-lock-alt" aria-hidden="true"></i></span>
                        <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
                        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">
                            <i class="bx bx-show" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="auth-input-wrap">
                        <span class="auth-input-icon"><i class="bx bx-lock-alt" aria-hidden="true"></i></span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Enter your password again" autocomplete="new-password" minlength="6" required>
                        <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false">
                            <i class="bx bx-show" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <p class="auth-legal">By creating an account, you agree to use WEB-CLUB respectfully and responsibly.</p>
                <p id="registerMessage" class="form-message" role="status" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary auth-button">
                    <span>Create account</span><i class="bx bx-right-arrow-alt" aria-hidden="true"></i>
                </button>
            </form>

            <p class="auth-footer">Already have an account? <a href="./login.html">Log in</a></p>
        </section>

        <p class="auth-tagline">Learn something new. Make something meaningful.</p>
    </main>
    <script src="../js/auth.js?v=2"></script>
</body>
</html>
